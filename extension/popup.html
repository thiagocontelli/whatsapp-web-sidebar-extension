<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Web Sidebar Toggle</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup-shell">
    <header class="popup-header">
      <div class="brand">
        <img src="icons/icon-48.png" width="32" height="32" alt="" class="brand-icon" />
        <div>
          <h1 class="brand-title" data-i18n="popupTitle">WhatsApp Sidebar</h1>
          <p class="brand-subtitle" data-i18n="popupSubtitle">Focus &amp; privacy mode</p>
        </div>
      </div>
      <span id="status-badge" class="status-badge" data-collapsed="false">Open</span>
    </header>

    <section class="hero-card">
      <button id="toggle-sidebar-btn" type="button" class="primary-btn">
        <span id="toggle-btn-icon" class="btn-icon" aria-hidden="true"></span>
        <span id="toggle-btn-label">Collapse sidebar</span>
      </button>
      <div class="shortcut-row">
        <span class="shortcut-hint" data-i18n="shortcutHint">Quick shortcut</span>
        <kbd id="shortcut-badge" class="kbd-badge">Alt + B</kbd>
      </div>
    </section>

    <footer class="popup-footer">
      <span id="connection-status" class="conn-text" data-i18n="statusReady">Ready for WhatsApp Web</span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
